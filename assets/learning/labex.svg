<svg
  xmlns="http://www.w3.org/2000/svg"
  width="180"
  height="78"
  viewBox="0 0 180 78"
  role="img"
  aria-label="LabEx learning progress"
>
  <style>
    .title {
      fill: #58A6FF;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      font-size: 13px;
      font-weight: 600;
    }

    .description {
      fill: #F0F6FC;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      font-size: 11px;
      font-weight: 500;
    }

    .status {
      fill: #8B949E;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      font-size: 9px;
      font-weight: 400;
    }
  </style>

  <image
    href="data:image/jpeg;base64,"
    x="79.5"
    y="1"
    width="21"
    height="21"
    preserveAspectRatio="xMidYMid meet"
  />

  <text
    x="90"
    y="35"
    text-anchor="middle"
    class="title"
  >LabEx</text>

  <text
    x="90"
    y="51"
    text-anchor="middle"
    class="description"
  >Linux Skills</text>

  <text
    x="90"
    y="64"
    text-anchor="middle"
    class="status"
  >In Progress</text>

  <line
    x1="28"
    y1="73"
    x2="152"
    y2="73"
    stroke="#21262D"
    stroke-width="1"
  />


  <line
    x1="179"
    y1="3"
    x2="179"
    y2="66"
    stroke="#21262D"
    stroke-width="1"
  />

</svg>
